name: RockeRoom
options:
  bundleIdPrefix: com.tengpeng.rockeroom
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    GENERATE_INFOPLIST_FILE: YES
targets:
  SharedKit:
    type: framework
    platform: iOS
    sources:
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tengpeng.rockeroom.sharedkit
        SKIP_INSTALL: YES

  RockeRoom:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    dependencies:
      - target: SharedKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tengpeng.rockeroom
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO

  PacketTunnelExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Extension
    dependencies:
      - target: SharedKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tengpeng.rockeroom.PacketTunnelExtension
        INFOPLIST_KEY_CFBundleDisplayName: RockeRoomTunnel
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
        INFOPLIST_KEY_NSExtension_NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
        CODE_SIGN_ENTITLEMENTS: Extension/PacketTunnelExtension.entitlements

  SharedKitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
        excludes:
          - AppSessionRestoreTests.swift
          - AutoModeViewModelTests.swift
          - HomeSummaryMetricTests.swift
          - LiveE2EScenarioTests.swift
    dependencies:
      - target: SharedKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tengpeng.rockeroom.tests
        GENERATE_INFOPLIST_FILE: YES

  RockeRoomAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/AppSessionRestoreTests.swift
      - path: Tests/AutoModeViewModelTests.swift
      - path: Tests/HomeSummaryMetricTests.swift
      - path: Tests/LiveE2EScenarioTests.swift
      - path: Tests/TestSupport.swift
    dependencies:
      - target: RockeRoom
      - target: SharedKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tengpeng.rockeroom.apptests
        GENERATE_INFOPLIST_FILE: YES

  RockeRoomUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: RockeRoom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tengpeng.rockeroom.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RockeRoom:
    build:
      targets:
        RockeRoom: all
        SharedKitTests: [test]
        RockeRoomAppTests: [test]
        RockeRoomUITests: [test]
    run:
      config: Debug
      executable: RockeRoom
      macroExpansion: RockeRoom
    test:
      config: Debug
      macroExpansion: RockeRoom
      targets:
        - SharedKitTests
        - RockeRoomAppTests
        - RockeRoomUITests
    profile:
      config: Release
      executable: RockeRoom
